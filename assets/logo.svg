<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2240"/>
      <stop offset="100%" stop-color="#163A66"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2589FE"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0D2240" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Rounded Clay Card -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bgGrad)" filter="url(#clayShadow)"/>
  <rect x="11" y="11" width="98" height="98" rx="27" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Inner Disc -->
  <circle cx="60" cy="60" r="32" fill="url(#accentBlue)" filter="url(#clayShadow)"/>
  <circle cx="60" cy="60" r="31" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Cap / Diamond Motif -->
  <path d="M60 44 L76 52 L60 60 L44 52 Z" fill="#FFFFFF"/>
  <path d="M48 55 C48 64 72 64 72 55" fill="#E2E8F0"/>

  <!-- Neon Progress Checkmark -->
  <path d="M52 68 L58 74 L70 62" stroke="url(#neonGreen)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
